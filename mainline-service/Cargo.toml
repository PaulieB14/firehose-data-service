[package]
name = "mainline-service"
version = "0.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Indexer-side daemon for GRC-006 (Mainline)."
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
hex = "0.4"
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "mainline-service"
path = "src/main.rs"

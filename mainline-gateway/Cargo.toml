[package]
name = "mainline-gateway"
version = "0.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Optional managed gateway for GRC-006 (Mainline). Stub."
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "mainline-gateway"
path = "src/main.rs"

[package]
name = "mainline-gateway"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Optional managed gateway for GRC-006 (Mainline) — operator discovery + Tier-2 quorum routing."
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

[[bin]]
name = "mainline-gateway"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

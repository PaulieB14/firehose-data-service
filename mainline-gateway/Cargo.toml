[package]
name = "mainline-gateway"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Optional managed gateway for GRC-006 (Mainline) — operator discovery + Tier-2 quorum routing."
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
async-trait = "0.1"
futures = "0.3"
# Path dep so we share the vendored sf.firehose.v2 proto stubs with the
# indexer-side service. Keeps the two crates byte-compatible on the wire
# without re-running tonic-build twice.
mainline-service = { path = "../mainline-service" }

[[bin]]
name = "mainline-gateway"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[profile.default]
src = "."
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["FirehoseDataService"]

# Skip compiling the bundled @graphprotocol/contracts L1/L2 stack — we only
# need the Horizon subset (data-service + payments). Everything else either
# pulls in legacy 0.7 / 0.6 contracts or is unrelated. Foundry's `skip`
# accepts an array of glob patterns matched against absolute paths.
skip = [
    "lib/contracts/packages/contracts/**",
    "lib/contracts/packages/subgraph-service/**",
    "lib/contracts/packages/issuance/**",
    "lib/contracts/packages/data-edge/**",
    "lib/contracts/packages/token-distribution/**",
    "lib/contracts/packages/horizon/contracts/mocks/**",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

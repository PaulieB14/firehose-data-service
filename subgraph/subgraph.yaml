specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FirehoseDataService
    network: arbitrum-sepolia
    source:
      # Placeholder. Update with the real Phase 0 deployment address and start block
      # after `forge script Deploy.s.sol --broadcast` completes on Arbitrum Sepolia.
      address: "0x0000000000000000000000000000000000000000"
      abi: FirehoseDataService
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Operator
        - Chain
        - AdvertisedLib
        - PaymentEvent
        - SlashEvent
        - DestinationChange
      abis:
        - name: FirehoseDataService
          file: ./abis/FirehoseDataService.json
      eventHandlers:
        - event: ChainRegistered(indexed bytes32,(uint64,bytes32,string,uint32,uint32,bool,bool))
          handler: handleChainRegistered
        - event: MainlineIndexerRegistered(indexed address,string,uint8,uint32)
          handler: handleIndexerRegistered
        - event: ChainAdvertised(indexed address,indexed bytes32,uint64)
          handler: handleChainAdvertised
        - event: MainlineServiceStarted(indexed address)
          handler: handleServiceStarted
        - event: MainlineServiceStopped(indexed address)
          handler: handleServiceStopped
        - event: ServicePaymentCollected(indexed address,indexed uint8,uint256)
          handler: handlePaymentCollected
        - event: ServiceProviderSlashed(indexed address,uint256)
          handler: handleIndexerSlashed
        - event: PaymentsDestinationSet(indexed address,indexed address)
          handler: handlePaymentsDestinationSet
      file: ./src/mapping.ts
